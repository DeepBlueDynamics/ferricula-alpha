# Isolated agent test stack. Standalone — do not merge with compose.yaml
# (a merge would keep the production runtime volume).
#
#   docker compose -f compose.isolated.yaml -p ferricula-test config -q
#   docker compose -f compose.isolated.yaml -p ferricula-test up -d --no-build
# API: 127.0.0.1:18875
#
# Environment (all optional, with defaults):
#   FERRICULA_ISOLATED_CONFIG  host path of the config
#                              (default ./config/agent.isolated.toml)
#   FERRICULA_MEMORY_VOLUME    EXISTING memory volume, mounted read-only
#                              (default ferricula-memory)
#   FERRICULA_IMAGE            image tag (default ferricula:3.0.0-alpha.0)

name: ferricula-test

services:
  agent:
    image: ${FERRICULA_IMAGE:-ferricula:3.0.0-alpha.0}
    container_name: ferricula-agent-test
    labels:
      - "ferricula.mcp_port=18875"
      - "ferricula.mcp_path=/mcp"
      - "ferricula.token_env=FERRICULA_OPERATOR_TOKEN"
      - "ferricula.bridge=scripts/ferricula_mcp_bridge.py"
    command: ["serve", "--config", "/app/config/agent.toml"]
    init: true
    restart: "no"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:18875:8875"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FERRICULA_OPERATOR_TOKEN_FILE: /run/secrets/ferricula_operator_token
    secrets:
      - ferricula_operator_token
    volumes:
      - ${FERRICULA_ISOLATED_CONFIG:-./config/agent.isolated.toml}:/app/config/agent.toml:ro
      - ferricula-memory:/data/agent-memory:ro
      - ferricula-runtime-test:/data/agent-runtime
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8875/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  ferricula_operator_token:
    file: ./secrets/ferricula_operator_token

volumes:
  ferricula-memory:
    external: true
    name: ${FERRICULA_MEMORY_VOLUME:-ferricula-memory}
  ferricula-runtime-test:
    name: ferricula-runtime-test
