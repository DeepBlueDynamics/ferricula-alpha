# Ferricula agent runtime — production compose file.
#
# The engine is persona-neutral; the persona lives in the memory volume
# (identity.json + agent.toml) and the mounted config. See config/examples/
# for a concrete deployment.
#
# Prereqs:
#   1. Pick a config. The generic example is mounted by default; point
#      FERRICULA_CONFIG at your own copy (e.g. ./config/agent.toml, which is
#      gitignored) for a real deployment.
#   2. Create the operator token secret file (mode 0600, do not commit):
#        mkdir -p secrets
#        openssl rand -hex 32 > secrets/ferricula_operator_token
#   3. docker compose up -d
#
# Environment (all optional, with defaults):
#   FERRICULA_CONFIG          host path of the runtime config
#                             (default ./config/agent.example.toml)
#   FERRICULA_MEMORY_VOLUME   name of the EXISTING Docker volume holding the
#                             agent's memory (default ferricula-memory)
#   FERRICULA_RUNTIME_VOLUME  name of the writable runtime-state volume
#                             (default ferricula-runtime)
#   FERRICULA_IMAGE           image tag (default ferricula:3.0.0-alpha.0)
#
# Volume policy:
#   - The memory volume is `external`: compose never creates, alters, or
#     removes it, and it is mounted READ-ONLY.
#   - All runtime state goes to the separate writable runtime volume
#     (task queue, activity mode, wake bookkeeping, chat, episodes).

name: ferricula

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${FERRICULA_IMAGE:-ferricula:3.0.0-alpha.0}
    container_name: ferricula-agent
    command: ["serve", "--config", "/app/config/agent.toml"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    # Publish on host loopback ONLY. Remote operator access goes over an SSH
    # tunnel or an authenticated TLS reverse proxy — never a direct publish.
    ports:
      - "127.0.0.1:8875:8875"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Names and file paths only — secret VALUES live in Docker secret files
    # and are resolved by the image entrypoint (VAR_FILE -> VAR).
    environment:
      FERRICULA_OPERATOR_TOKEN_FILE: /run/secrets/ferricula_operator_token
      # Enable alongside the matching entries in the `secrets:` blocks below
      # when the corresponding capability is turned on in the config:
      # NUTNEWS_TOKEN_FILE: /run/secrets/nutnews_token
      # ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key

    secrets:
      - ferricula_operator_token
      # - nutnews_token
      # - anthropic_api_key

    volumes:
      # Runtime config (committable: contains env-var NAMES, never values).
      - ${FERRICULA_CONFIG:-./config/agent.example.toml}:/app/config/agent.toml:ro
      # The agent's memory — read-only.
      - ferricula-memory:/data/agent-memory:ro
      # Runtime state — the only writable persistence.
      - ferricula-runtime:/data/agent-runtime

    # Hardening: immutable root fs, no privilege escalation, no capabilities.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 2

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8875/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  ferricula_operator_token:
    file: ./secrets/ferricula_operator_token
  # nutnews_token:
  #   file: ./secrets/nutnews_token
  # anthropic_api_key:
  #   file: ./secrets/anthropic_api_key

volumes:
  # Pre-existing memory volume. `external: true` means compose will never
  # create, alter, or remove it.
  ferricula-memory:
    external: true
    name: ${FERRICULA_MEMORY_VOLUME:-ferricula-memory}
  # Compose-managed writable state volume.
  ferricula-runtime:
    name: ${FERRICULA_RUNTIME_VOLUME:-ferricula-runtime}
