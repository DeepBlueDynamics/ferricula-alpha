[package]
name = "ferricula-server"
version.workspace = true
edition = "2024"
license-file.workspace = true

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4", "serde"] }

ferricula-core = { path = "../ferricula-core" }
ferricula-cognition = { path = "../ferricula-cognition" }
ferricula-episode = { path = "../ferricula-episode" }
ferricula-ingest = { path = "../ferricula-ingest" }
ferricula-gates = { path = "../ferricula-gates" }
# Text embeddings over HTTP only; no `ml` (ONNX) in the server image.
ferricula-semantic = { path = "../ferricula-semantic", default-features = false }
base64 = "0.22"
roaring = "0.11"

[dev-dependencies]
tempfile = "3"
lopdf = "0.34"
