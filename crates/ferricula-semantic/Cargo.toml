[package]
name = "ferricula-semantic"
version.workspace = true
edition = "2021"
license-file.workspace = true

[features]
default = ["ml"]
ml = ["dep:ort", "dep:tokenizers", "dep:simsimd"]
cuda = ["ort/cuda"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# default-features off: no native-tls/OpenSSL, so the server image (which
# depends on this crate without `ml`) needs no system TLS libraries.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Blocking HTTP for text_embed::ShivvrEmbedder (same ureq as ferricula-search).
ureq = { version = "2.12", features = ["json"] }
# Image bytes for image_embed::ShivvrImageEmbedder.
base64 = "0.22"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"

ferricula-search = { path = "../ferricula-search" }

# Optional ML dependencies
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "tls-native", "ndarray"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig", "progressbar"], optional = true }
simsimd = { version = "6.5.12", optional = true }

[lib]
path = "src/lib.rs"
